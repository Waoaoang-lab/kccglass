<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>브이월드 3D 시험</title>
<style>
  body { margin: 0; font-family: "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif; font-size: 14px; background: #e9eef0; color: #15202a; }
  header { padding: 10px 16px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  header b { font-size: 16px; }
  header a { color: #1d6a73; }
  #vmap { width: 100%; height: 62vh; background: #1a2228; }
  #log { margin: 0; padding: 12px 16px; font: 12px/1.5 ui-monospace, Menlo, monospace; white-space: pre-wrap; word-break: break-all; }
</style>
</head>
<body>
<header>
  <b>브이월드 3D 지도 시험</b>
  <span id="variant"></span>
  <a href="?d=0">방식 1</a><a href="?d=1">방식 2</a><a href="?d=2">방식 3</a>
  <span>· 20초 정도 기다린 뒤 화면 전체를 캡처해 보내 주세요.</span>
</header>
<div id="vmap"></div>
<pre id="log">불러오는 중…</pre>
<script>
  // 브이월드 3D(WebGL) 지도 API가 이 사이트에서 열리는지, 안쪽 3D 엔진에 접근할 수 있는지 확인
  var KEY = '1C529277-B5E8-4B90-A0DE-F81F09E4C4E4';
  var d = (location.search.match(/d=(\d)/) || [0, '0'])[1];
  var V = [
    { ver: '2.0', dom: 'https://waoaoang-lab.github.io' },
    { ver: '2.0', dom: 'waoaoang-lab.github.io' },
    { ver: '3.0', dom: 'https://waoaoang-lab.github.io' },
  ][+d] || { ver: '2.0', dom: 'https://waoaoang-lab.github.io' };
  document.getElementById('variant').textContent = '방식 ' + (+d + 1) + ' · version ' + V.ver + ' · domain ' + V.dom;
  window.__before = Object.keys(window);
  window.__errs = [];
  window.addEventListener('error', function (e) { window.__errs.push((e.message || 'error') + ' @ ' + (e.filename || '').split('?')[0]); });
  document.write('<script src="https://map.vworld.kr/js/webglMapInit.js.do?version=' + V.ver + '&apiKey=' + KEY + '&domain=' + encodeURIComponent(V.dom) + '"><\/script>');
</script>
<script>
  var log = document.getElementById('log'), out = [];
  function add(t) { out.push(t); log.textContent = out.join('\n'); }
  var map = null;
  try {
    add('vw: ' + typeof window.vw + (window.vw ? ' · keys: ' + Object.keys(vw).slice(0, 60).join(', ') : ''));
    if (window.vw && vw.Map) {
      var opts = new vw.MapOptions(
        vw.BasemapType.GRAPHIC, '', vw.DensityType.FULL, vw.DensityType.BASIC, false,
        new vw.CameraPosition(new vw.CoordZ(127.0203, 37.5163, 1200), new vw.Direction(0, -90, 0)),
        new vw.CameraPosition(new vw.CoordZ(127.0203, 37.5120, 420), new vw.Direction(0, -30, 0))
      );
      map = new vw.Map('vmap', opts);
      window.__map = map;
      add('지도 생성: 성공');
    } else add('지도 생성: vw.Map 없음');
  } catch (e) { add('지도 생성 오류: ' + e.message); }
  setTimeout(function () {
    var added = Object.keys(window).filter(function (k) { return window.__before.indexOf(k) < 0 && k.indexOf('__') !== 0; });
    add('\n새로 생긴 전역: ' + added.slice(0, 80).join(', '));
    add('Cesium: ' + typeof window.Cesium + (window.Cesium ? ' · VERSION ' + Cesium.VERSION : ''));
    add('ws3d: ' + typeof window.ws3d + (window.ws3d ? ' · keys: ' + Object.keys(ws3d).slice(0, 40).join(', ') : ''));
    if (map) {
      var proto = Object.getPrototypeOf(map), names = [];
      for (var k in map) names.push(k);
      add('map 속성·메서드: ' + names.slice(0, 80).join(', '));
      add('map 프로토타입: ' + Object.getOwnPropertyNames(proto).slice(0, 80).join(', '));
    }
    if (window.ws3d && ws3d.viewer) add('ws3d.viewer: ' + Object.keys(ws3d.viewer).slice(0, 40).join(', '));
    var canv = document.querySelectorAll('#vmap canvas');
    add('3D 화면(canvas) 수: ' + canv.length);
    add('오류: ' + (window.__errs.length ? window.__errs.join(' | ') : '없음'));
  }, 15000);
</script>
</body>
</html>
